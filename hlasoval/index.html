<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="canonical" href="https://durica.si/hlasoval/">

<meta property="og:site_name" content="durica.si">
<meta property="og:title" content="Čo hráme?">
<meta property="og:description" content="Ťukni na štýl hudby, ktorý chceš počuť. DJ to vidí naživo.">
<meta property="og:url" content="https://durica.si/hlasoval/">
<meta property="og:image" content="https://durica.si/hlasoval/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="icon" type="image/png" href="ikony/icon-192.png">
<link rel="apple-touch-icon" href="ikony/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="hlasoval.css">
<style>
/* Layout: jeden úzky stĺpec ako na telefóne. Hore logo a otázka, v strede zoznam štýlov, dole poznámka. */
.wrap{position:relative;z-index:1;max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:18px;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top img{width:92px;height:auto;filter:drop-shadow(0 10px 22px rgba(0,0,0,.5))}
.hero{display:flex;flex-direction:column;gap:6px}
.hero h1{margin:0;font-size:clamp(50px,15vw,66px)}
.hero p{margin:0;color:var(--fg-2);font-size:15.5px;max-width:34ch;text-wrap:pretty;min-height:1.45em;transition:opacity .3s}

.banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r-m);background:var(--accent-soft);border:1px solid rgba(255,200,30,.3);color:var(--fg);font-size:14px;font-weight:500}
.banner svg{flex:none;width:18px;height:18px}

.list{display:flex;flex-direction:column;gap:9px}
.choice{position:relative;overflow:hidden;width:100%;min-height:62px;padding:0 16px 0 18px;border-radius:var(--r-m);
  display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0)) ,var(--panel);
  box-shadow:inset 0 0 0 1px var(--line),inset 0 1px 0 rgba(255,255,255,.04);
  transition:transform .18s var(--ease-out),box-shadow .25s var(--ease-out),background .25s}
.choice:active{transform:scale(.975)}
.choice .fill{position:absolute;inset:0 auto 0 0;width:0;background:rgba(255,255,255,.05);transition:width .7s var(--ease-out)}
.choice .txt{position:relative;display:flex;flex-direction:column;min-width:0;gap:3px}
.choice .txt b{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .25s}
.choice .txt span{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.choice .right{position:relative;display:flex;align-items:center;gap:10px;flex:none}
.choice .pct{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1;color:var(--muted);min-width:3ch;text-align:right;opacity:0;transform:translateX(6px);transition:opacity .35s,transform .35s var(--ease-out),color .25s}
.list.show-pct .choice .pct{opacity:1;transform:none}
.choice .check{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;transform:scale(0);transition:transform .45s var(--ease-spring)}
.choice .check svg{width:14px;height:14px}
.choice.mine{box-shadow:inset 0 0 0 1.5px var(--accent),0 10px 30px -14px rgba(255,200,30,.45);background:linear-gradient(180deg,rgba(255,200,30,.06),rgba(255,200,30,.02)),var(--panel)}
.choice.mine .fill{background:var(--accent-soft)}
.choice.mine .txt b{color:var(--accent)}
.choice.mine .pct{color:var(--accent)}
.choice.mine .check{transform:scale(1)}
.choice.lead:not(.mine) .txt b{color:var(--fg)}
.choice.sending{pointer-events:none}
.list[aria-disabled="true"] .choice{opacity:.42;pointer-events:none}
.choice.skel{min-height:62px;pointer-events:none;background:var(--panel);overflow:hidden}
.choice.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent);transform:translateX(-100%);animation:shimmer 1.4s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}

.summary{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 4px;color:var(--muted);font-size:13px;min-height:1.4em}
.summary b{color:var(--fg);font-weight:600}
.summary .tnum{font-family:var(--f-mono);font-size:12px}

.foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;color:var(--muted);font-size:12.5px;padding-top:10px}
.foot a{text-decoration:none;color:var(--muted);font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.foot a:hover{color:var(--fg)}

.err{display:flex;flex-direction:column;align-items:center;gap:12px;padding:28px 18px;border-radius:var(--r-m);background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);text-align:center;color:var(--fg-2)}
.err button{background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600}

@media (min-width:720px){
  .wrap{min-height:auto;margin-top:5vh;margin-bottom:5vh;padding-top:28px;padding-bottom:28px;background:var(--panel);border-radius:28px;box-shadow:0 40px 80px -40px rgba(0,0,0,.9),inset 0 0 0 1px var(--line)}
  .choice{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0)),var(--panel-2)}
  .choice.mine{background:linear-gradient(180deg,rgba(255,200,30,.07),rgba(255,200,30,.02)),var(--panel-2)}
}
</style>
</head>
<body>
<main class="wrap">
  <header class="top reveal">
    <img src="zubor.png" alt="Red Bull Zubor" width="92" height="80">
    <span class="live" id="live"><i></i><span id="liveTxt">Naživo</span></span>
  </header>

  <section class="hero reveal">
    <h1 class="display">Čo hráme?</h1>
    <p id="sub">Ťukni na štýl, ktorý chceš počuť. DJ to vidí hneď.</p>
  </section>

  <div class="banner reveal" id="pausedBanner" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5v14M15 5v14"/></svg>
    <span>DJ hlasovanie na chvíľu pozastavil. Hlasy sa otvoria o chvíľu.</span>
  </div>

  <section class="list reveal" id="list" aria-label="Štýly hudby">
    <div class="choice skel"></div><div class="choice skel"></div><div class="choice skel"></div><div class="choice skel"></div><div class="choice skel"></div>
  </section>

  <div class="summary reveal" id="summary"></div>

  <footer class="foot reveal">
    <span id="footTxt">Jeden hlas na telefón. Zmeniť ho môžeš kedykoľvek.</span>
    <a href="https://durica.si/" rel="noopener">durica.si</a>
  </footer>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="hlasoval.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const list = $("list");
  let genres = [], els = {}, mine = null, state = null, pollT = null, failures = 0, sending = false;

  function build(gs){
    genres = gs; els = {}; list.innerHTML = "";
    gs.forEach(g=>{
      const b = document.createElement("button");
      b.className = "choice"; b.id = "g-"+g.id; b.type = "button";
      b.innerHTML = `<span class="fill"></span>
        <span class="txt"><b>${g.name}</b><span>${g.bpm[0]}–${g.bpm[1]} BPM</span></span>
        <span class="right"><span class="pct tnum"></span><span class="check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></span>`;
      b.addEventListener("click", ()=>cast(g.id));
      list.appendChild(b); els[g.id] = b;
    });
  }

  function render(){
    if (!state) return;
    const total = state.total || 0, counts = state.counts || {};
    const order = HL.order(genres, counts);
    const lead = total ? order[0] : null;
    list.classList.toggle("show-pct", !!mine);
    list.setAttribute("aria-disabled", state.paused ? "true" : "false");
    $("pausedBanner").hidden = !state.paused;
    $("live").classList.toggle("paused", !!state.paused);
    $("liveTxt").textContent = state.paused ? "Pauza" : "Naživo";
    genres.forEach(g=>{
      const el = els[g.id]; if (!el) return;
      const p = total ? (counts[g.id]||0)/total*100 : 0;
      el.classList.toggle("mine", mine===g.id);
      el.classList.toggle("lead", lead===g.id);
      el.querySelector(".fill").style.width = mine ? p.toFixed(1)+"%" : "0%";
      const pe = el.querySelector(".pct");
      if (mine) HL.tween(pe, Math.round(p), v=>Math.round(v)+" %"); else pe.textContent = "";
    });
    $("sub").textContent = mine ? "Takto to práve vidí DJ. Ťukni inam, ak chceš hlas zmeniť." : "Ťukni na štýl, ktorý chceš počuť. DJ to vidí hneď.";
    const s = $("summary");
    if (mine && total){
      const ln = HL.genreMap(genres)[lead];
      const pct = Math.round((counts[lead]||0)/total*100);
      s.innerHTML = `<span>Dav teraz chce <b>${ln ? ln.name : "—"}</b> · ${pct} %</span><span class="tnum">${total} ${HL.plural(total,"hlas","hlasy","hlasov")}</span>`;
    } else if (mine){
      s.innerHTML = `<span>Si prvý. Ďalšie hlasy uvidíš tu.</span>`;
    } else s.innerHTML = "";
  }

  async function cast(id){
    if (sending || !state || state.paused) return;
    if (mine === id){ HL.toast("Už hlasuješ za " + HL.genreMap(genres)[id].name); return; }
    const prev = mine; mine = id; sending = true; HL.haptic(12); render();
    try{
      const r = await HL.vote(id);
      if (!r.ok){ mine = r.genre || prev; state.paused = !!r.paused; render(); HL.toast("Hlasovanie je pozastavené"); }
      else { HL.toast(prev ? "Hlas zmenený na " + HL.genreMap(genres)[id].name : "Hlas je u DJa"); schedule(600); }
    }catch(e){
      mine = prev; render(); HL.toast("Nepodarilo sa uložiť. Skús to znova.");
    } finally { sending = false; }
  }

  async function refresh(){
    try{
      const [t, m] = await Promise.all([HL.tally(), mine===null && !state ? HL.myVote() : null]);
      failures = 0;
      if (!state || JSON.stringify(state.genres) !== JSON.stringify(t.genres)) build(t.genres);
      if (state && state.round !== t.round){ mine = null; HL.toast("Nové kolo. Hlasuj znova."); }
      state = t;
      if (m && m.genre && !sending) mine = m.genre;
      $("live").classList.remove("off");
      render();
      showErr(false);
    }catch(e){
      failures++;
      $("live").classList.add("off");
      if (!state && failures >= 2) showErr(true);
    }
  }
  function showErr(on){
    let e = $("err");
    if (on && !e){
      e = document.createElement("div"); e.className = "err"; e.id = "err";
      e.innerHTML = `<span>Nepodarilo sa načítať hlasovanie. Skontroluj internet.</span><button type="button" id="retry">Skúsiť znova</button>`;
      list.replaceChildren(e); $("retry").addEventListener("click", ()=>{ list.innerHTML='<div class="choice skel"></div><div class="choice skel"></div><div class="choice skel"></div>'; refresh(); });
    } else if (!on && e && state) { /* list was rebuilt by build() */ }
  }
  function schedule(ms){
    clearTimeout(pollT);
    if (document.hidden) return;
    pollT = setTimeout(async()=>{ await refresh(); schedule(Math.min(4000 + failures*2000, 15000)); }, ms);
  }
  document.addEventListener("visibilitychange", ()=>{ if (document.hidden) clearTimeout(pollT); else { refresh(); schedule(4000); } });
  window.addEventListener("online", ()=>{ refresh(); schedule(4000); });

  refresh().then(()=>schedule(4000));
})();
</script>
</body>
</html>
