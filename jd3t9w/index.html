<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tanier pre dvoch</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#EFF2EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121613" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

</head>
<body>

<div class="app" id="app"><div class="loading">Načítavam…</div></div>

<div class="dock" id="dock" hidden>
  <div>
    <button class="act main" data-action="open-photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Foto jedla</button>
    <button class="act" data-action="open-code"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 5v14M7 5v14M10 5v14M14 5v14M16 5v14M20 5v14"/></svg>Čiarový kód</button>
    <button class="act" data-action="open-basic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.5"/></svg>Základné jedlá</button>
  </div>
</div>

<div class="tabs" id="tabs" hidden>
  <nav aria-label="Sekcie">
    <a href="#den" data-view="den"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Deň</a>
    <a href="#potraviny" data-view="potraviny"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h9"/></svg>Potraviny</a>
    <a href="#nastavenie" data-view="nastavenie"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Účet</a>
  </nav>
</div>

<input id="photoInput" type="file" accept="image/*" capture="environment" class="vh" tabindex="-1">
<input id="codeInput" type="file" accept="image/*" capture="environment" class="vh" tabindex="-1">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="zxing.min.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
