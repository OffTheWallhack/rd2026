<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Pult · si/mixoval</title>
<meta name="description" content="DJ pult v prehliadači v klubovom rozložení: dva prehrávače a mixér. Displej s vlnou, jog, hot cue, slučky, sync, EQ, filter, FX a nahrávanie mixu do MP3. Skladby ostávajú u teba.">
<meta name="theme-color" content="#07080a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pult">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../ikony/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../ikony/icon-180.png">
<meta property="og:title" content="Pult · si/mixoval">
<meta property="og:description" content="DJ pult v prehliadači: dva prehrávače a mixér. Zadarmo.">
<meta property="og:image" content="https://durica.si/mixoval/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../mx.css">
<link rel="stylesheet" href="pult.css">
<script data-goatcounter="https://durica.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
<header class="bar">
  <a class="back" href="../" aria-label="Späť na mixoval">‹<span class="bt"> mixoval</span></a>
  <span class="sp"></span>
  <button class="btn skinbtn" id="skinBtn" type="button" aria-label="Vzhľad mixéra (tmavý alebo biely)">◐</button>
  <button class="btn viewbtn" id="viewBtn" type="button" title="Počet prehrávačov">2 DECKS</button>
  <div class="rec">
    <select id="kbps" aria-label="Kvalita MP3"><option value="320">320</option><option value="256">256</option><option value="192">192</option></select>
    <button class="btn recbtn" id="recBtn" type="button"><span class="dot"></span><span id="recTxt">REC</span></button>
  </div>
  <span class="mono recinfo" id="recInfo"></span>
</header>

<main class="booth" id="booth" aria-label="DJ pult"></main>

<div class="recout" id="recOut" hidden></div>

<!-- knižnica skladieb (otvorí sa tlačidlom BROWSE na prehrávači) -->
<div class="sheet" id="sheet" hidden>
  <div class="sheetin" role="dialog" aria-label="Skladby">
    <div class="sh-h">
      <h2>Skladby</h2>
      <div class="tgt" id="tgt" aria-label="Načítať do decku"><button type="button" data-t="0" class="t0">1</button><button type="button" data-t="1" class="t1">2</button><button type="button" data-t="2" class="t2">3</button><button type="button" data-t="3" class="t3">4</button></div>
      <button class="x" id="sheetX" type="button" aria-label="Zavrieť">×</button>
    </div>
    <div class="sh-b">
      <button class="btn" id="addFiles" type="button">Súbory</button>
      <button class="btn" id="addDir" type="button">Priečinok / USB</button>
      <button class="btn" id="addRb" type="button" title="Súbor → Exportovať zbierku vo formáte xml">rekordbox XML</button>
      <input type="file" id="rbIn" class="vh" accept=".xml,text/xml,application/xml">
      <input type="file" id="fileIn" class="vh" accept="audio/*,.mp3,.wav,.aif,.aiff,.flac,.m4a,.aac,.ogg,.opus" multiple>
      <input type="file" id="dirIn" class="vh" webkitdirectory multiple>
    </div>
    <input type="search" id="q" class="q" placeholder="Hľadať v skladbách…" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="list" id="list"></div>
    <p class="empty" id="empty">Pridaj skladby z telefónu, počítača alebo USB (aj z rekordboxu). Všetko ostáva v tvojom prehliadači a nikam sa to nenahráva. Môžeš ich sem aj pretiahnuť.</p>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>
<script src="../lame.min.js"></script>
<script src="../rec.js"></script>
<script src="pult.js"></script>
<script src="izba.js"></script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('../sw.js').catch(function(){});}</script>
<script src="/stats.js" defer></script>
</body>
</html>
