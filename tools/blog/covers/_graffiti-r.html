<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#222}canvas{display:block}</style></head><body>
<canvas id="c" width="1024" height="1024"></canvas>
<script>
const N=1024, c=document.getElementById('c'), x=c.getContext('2d');
let seed=+(new URLSearchParams(location.search).get('s')||7);
const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647, gauss=()=>{let u=0;for(let i=0;i<5;i++)u+=rnd();return (u-2.5)/1.45};
const lerp=(a,b,t)=>a+(b-a)*t;
function bez(p,t){const m=1-t;return [m*m*m*p[0][0]+3*m*m*t*p[1][0]+3*m*t*t*p[2][0]+t*t*t*p[3][0], m*m*m*p[0][1]+3*m*m*t*p[1][1]+3*m*t*t*p[2][1]+t*t*t*p[3][1]]}
// ---------- concrete wall
function concrete(){
  x.fillStyle='#4a4b48'; x.fillRect(0,0,N,N);
  // soft blotches
  for(let i=0;i<220;i++){const r=40+rnd()*160,px=rnd()*N,py=rnd()*N;const g=x.createRadialGradient(px,py,0,px,py,r);const l=rnd()<.5?'255,255,255':'0,0,0';g.addColorStop(0,`rgba(${l},${.03+rnd()*.05})`);g.addColorStop(1,`rgba(${l},0)`);x.fillStyle=g;x.fillRect(px-r,py-r,r*2,r*2);}
  // grain
  const im=x.getImageData(0,0,N,N),d=im.data;for(let i=0;i<d.length;i+=4){const n=(rnd()-.5)*34+(rnd()-.5)*14;d[i]+=n;d[i+1]+=n;d[i+2]+=n*.95;}x.putImageData(im,0,0);
  // pits (air bubbles)
  for(let i=0;i<900;i++){const px=rnd()*N,py=rnd()*N,r=.8+rnd()*3.2;x.fillStyle=`rgba(15,15,14,${.35+rnd()*.4})`;x.beginPath();x.ellipse(px,py,r,r*(.6+rnd()*.5),rnd()*3,0,7);x.fill();x.fillStyle=`rgba(255,255,255,${.06+rnd()*.08})`;x.beginPath();x.ellipse(px+r*.6,py+r*.6,r*.8,r*.5,rnd()*3,0,7);x.fill();}
  // formwork seam + tie holes
  x.strokeStyle='rgba(10,10,9,.55)';x.lineWidth=3;x.beginPath();x.moveTo(0,690);for(let i=0;i<=N;i+=16)x.lineTo(i,690+Math.sin(i*.02)*2+gauss()*1.2);x.stroke();
  x.strokeStyle='rgba(255,255,255,.08)';x.lineWidth=2;x.beginPath();x.moveTo(0,694);x.lineTo(N,693);x.stroke();
  // hairline crack
  x.strokeStyle='rgba(8,8,7,.7)';x.lineWidth=2.2;x.beginPath();let cx=830,cy=0;x.moveTo(cx,cy);while(cy<N*.8){cy+=14+rnd()*20;cx+=gauss()*16;x.lineTo(cx,cy);}x.stroke();
  // water stains running down
  for(let i=0;i<10;i++){const px=rnd()*N;const g=x.createLinearGradient(0,0,0,N);x.fillStyle=`rgba(0,0,0,${.05+rnd()*.05})`;x.fillRect(px,0,6+rnd()*26,N*(.3+rnd()*.7));}
}
concrete();
// ---------- paint layer
const P=document.createElement('canvas');P.width=P.height=N;const p=P.getContext('2d');
const S=2; // scale 512 -> 1024
const strokes=[
 // [bezier points, width profile fn(t)->width in 1024 px]
 {pts:[[110,150],[210,150],[300,520],[350,900]].map(a=>a.slice()), w:t=>14+Math.sin(Math.min(1,t*1.1)*Math.PI)*84*(1-.0*t)+ (t>.85?(1-t)*-60:0)},
];
function sprayStroke(pts,wf,col,opts={}){
  const steps=420;
  for(let i=0;i<=steps;i++){
    const t=i/steps,[bx,by]=bez(pts,t),w=Math.max(6,wf(t));
    // core stamps with ragged edge
    const k=Math.ceil(w/6);
    for(let j=0;j<k*2;j++){
      const a=rnd()*6.283,r=Math.sqrt(rnd())*w*.5;
      const px=bx+Math.cos(a)*r,py=by+Math.sin(a)*r;
      p.fillStyle=col;p.beginPath();p.arc(px,py,2.2+rnd()*3.2,0,7);p.fill();
    }
    // overspray halo
    if(!opts.noHalo) for(let j=0;j<5;j++){const a=rnd()*6.283,r=(.5+Math.abs(gauss())*.55)*w*.62+w*.15;p.fillStyle=col;p.globalAlpha=.10+rnd()*.14;p.beginPath();p.arc(bx+Math.cos(a)*r,by+Math.sin(a)*r,.8+rnd()*1.6,0,7);p.fill();p.globalAlpha=1;}
  }
}
// ----- letter R from three calligraphic strokes
const pal={main:'#22d474',dark:'#0e3d25',hi:'#d7ffe6',out:'#08110c'};
// stem: starts far top-left, runs diagonally right-down
const stem=[[70,110],[250,60],[330,520],[420,930]];
const bowl=[[190,150],[580,20],[880,150],[850,350]];
const bowl2=[[850,350],[840,540],[560,590],[290,520]];
const leg=[[470,520],[600,640],[720,780],[930,930]];
const flick=[[930,930],[975,950],[990,900],[955,860]];
const K=1.42;
const wStem=t=>K*(20+Math.sin(Math.pow(t,.8)*Math.PI*.95)*70+ (t<.08?-14*(1-t/.08):0) - (t>.9?(t-.9)*220:0));
const wBowl=t=>K*(26+Math.sin(t*Math.PI)*64);
const wLeg=t=>K*(24+Math.sin(Math.pow(t,.9)*Math.PI*.9)*66-(t>.9?(t-.9)*200:0));
const wFlick=t=>K*(26-t*18);
// outline / shadow pass (offset down-right)
p.save();p.translate(16,20);
[[stem,wStem],[bowl,wBowl],[bowl2,wBowl],[leg,wLeg],[flick,wFlick]].forEach(([pt,wf])=>sprayStroke(pt,t=>wf(t)+18,pal.out,{noHalo:true}));
p.restore();
// dark undertone
[[stem,wStem],[bowl,wBowl],[bowl2,wBowl],[leg,wLeg],[flick,wFlick]].forEach(([pt,wf])=>sprayStroke(pt,t=>wf(t)+8,pal.dark));
// main colour
[[stem,wStem],[bowl,wBowl],[bowl2,wBowl],[leg,wLeg],[flick,wFlick]].forEach(([pt,wf])=>sprayStroke(pt,wf,pal.main));
// highlight core (thin, wobbly, offset up-left)
p.save();p.translate(-10,-12);p.globalAlpha=.55;[[stem,wStem],[bowl,wBowl],[bowl2,wBowl],[leg,wLeg]].forEach(([pt,wf])=>sprayStroke(pt,t=>wf(t)*.14,pal.hi,{noHalo:true}));p.globalAlpha=1;p.restore();
// ----- drips from low parts of strokes
function drip(px,py,len,w,col){
  p.fillStyle=col;
  for(let y=0;y<len;y+=1.5){const ww=w*(1-.15*(y/len))+Math.sin(y*.3)*.6;p.fillRect(px-ww/2+gauss()*.4,py+y,ww,2);}
  p.beginPath();p.arc(px,py+len,w*.78,0,7);p.fill();
  p.fillStyle='rgba(255,255,255,.35)';p.beginPath();p.arc(px-w*.2,py+len-w*.15,w*.22,0,7);p.fill();
}
const dripSpots=[[bez(bowl2,.35),190,14],[bez(bowl2,.78),95,10],[bez(stem,.66),260,15],[bez(leg,.5),140,12],[bez(bowl,.15),90,9],[bez(leg,.84),75,9],[bez(stem,.9),70,10]];
dripSpots.forEach(([[bx,by],len,w])=>drip(bx+gauss()*8,by+58,len,w,pal.main));
// splatter
for(let i=0;i<90;i++){const [bx,by]=bez(i%2?leg:bowl,rnd());const a=rnd()*6.283,r=60+rnd()*220;const px=bx+Math.cos(a)*r,py=by+Math.sin(a)*r;p.fillStyle=pal.main;p.globalAlpha=.55+rnd()*.4;p.beginPath();p.arc(px,py,.8+Math.pow(rnd(),3)*7,0,7);p.fill();p.globalAlpha=1;}
// thin paint on rough concrete: punch tiny holes + chips
p.globalCompositeOperation='destination-out';
for(let i=0;i<5200;i++){const px=rnd()*N,py=rnd()*N,r=.6+Math.pow(rnd(),2.2)*3.2;p.globalAlpha=.55+rnd()*.45;p.beginPath();p.ellipse(px,py,r,r*(.5+rnd()*.7),rnd()*3,0,7);p.fill();}
for(let i=0;i<26;i++){const px=rnd()*N,py=rnd()*N,r=6+rnd()*14;p.globalAlpha=.9;p.beginPath();let a0=rnd()*6;for(let k=0;k<7;k++){const a=a0+k/7*6.283,rr=r*(.55+rnd()*.7);k?p.lineTo(px+Math.cos(a)*rr,py+Math.sin(a)*rr):p.moveTo(px+Math.cos(a)*rr,py+Math.sin(a)*rr);}p.closePath();p.fill();}
p.globalAlpha=1;p.globalCompositeOperation='source-over';
// composite paint over concrete, letting concrete texture bite through
x.save();x.shadowColor='rgba(0,0,0,.45)';x.shadowBlur=14;x.shadowOffsetY=6;x.drawImage(P,0,0);x.restore();
// concrete pits drawn over paint (multiply feel)
x.globalCompositeOperation='multiply';
for(let i=0;i<700;i++){const px=rnd()*N,py=rnd()*N,r=.8+rnd()*2.4;x.fillStyle=`rgba(60,60,58,${.25+rnd()*.35})`;x.beginPath();x.arc(px,py,r,0,7);x.fill();}
x.globalCompositeOperation='source-over';
// vignette
const v=x.createRadialGradient(N/2,N/2,N*.25,N/2,N/2,N*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.45)');x.fillStyle=v;x.fillRect(0,0,N,N);
</script></body></html>
