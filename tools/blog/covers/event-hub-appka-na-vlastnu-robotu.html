<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../cv/f/f.css"><style>html,body{margin:0;background:#0B0C0B}canvas{display:block}</style></head><body>
<canvas id="c" width="1600" height="900"></canvas><script src="_base.js"></script><script>
// thumbnail: short title, the app's real screens and a few UI bits
const srcs=['../../../img/eh-calendar.webp','../../../img/eh-stats.webp','../../../img/eh-tech.webp']; // [1] (stats) is not drawn: it shows client names
Promise.all([document.fonts.load('600 30px "Space Grotesk"'),document.fonts.load('500 24px "JetBrains Mono"'),...srcs.map(s=>new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.src=s;}))]).then(([, ,...imgs])=>{
bg('#0F1412','#060807');
let g=x.createRadialGradient(1150,470,40,1150,470,760);g.addColorStop(0,'rgba(31,191,98,.28)');g.addColorStop(1,'rgba(31,191,98,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
// no brain: the app's screens are the picture
// cards
function card(img,cx,cy,w,rot,sh){const h=w*img.height/img.width;x.save();x.translate(cx,cy);x.rotate(rot);x.shadowColor='rgba(0,0,0,.7)';x.shadowBlur=60;x.shadowOffsetY=24;x.fillStyle='#0A0A0A';rr(-w/2-12,-h/2-12,w+24,h+24,28);x.fill();x.shadowColor='transparent';x.save();rr(-w/2,-h/2,w,h,18);x.clip();x.drawImage(img,0,0,img.width,sh||img.height,-w/2,-h/2,w,h*(sh?1:1));x.restore();x.restore();}
// glowing links from the brain to each screen
function link(x0,y0,x1,y1){const gr=x.createLinearGradient(x0,y0,x1,y1);gr.addColorStop(0,'rgba(92,240,164,.9)');gr.addColorStop(1,'rgba(92,240,164,.15)');x.strokeStyle=gr;x.lineWidth=4;x.setLineDash([2,14]);x.lineCap='round';x.beginPath();x.moveTo(x0,y0);x.bezierCurveTo((x0+x1)/2,y0,(x0+x1)/2,y1,x1,y1);x.stroke();x.setLineDash([]);x.fillStyle='#5CF0A4';x.beginPath();x.arc(x0,y0,7,0,7);x.fill();}
card(imgs[0],1080,420,430,-.05);
card(imgs[2],1380,600,400,.05);
x.textBaseline='alphabetic';x.fillStyle='#FFFFFF';x.shadowColor='rgba(0,0,0,.6)';x.shadowBlur=30;x.font='700 132px "Space Grotesk", sans-serif';x.fillText('Bez',80,400);x.fillStyle='#5CF0A4';x.fillText('programo-',80,530);x.fillText('vania.',80,660);x.shadowColor='transparent';x.textBaseline='middle';
// small UI bits
function chip(cx,cy,w,h,fill,stroke){x.save();x.shadowColor='rgba(0,0,0,.55)';x.shadowBlur=30;x.fillStyle=fill;rr(cx,cy,w,h,h/2>22?18:h/2);x.fill();x.restore();if(stroke){x.strokeStyle=stroke;x.lineWidth=2;rr(cx,cy,w,h,h/2>22?18:h/2);x.stroke();}}
// notification
chip(80,100,330,86,'#1C1F1D','rgba(255,255,255,.12)');x.fillStyle='#1FBF62';x.beginPath();x.arc(122,143,20,0,7);x.fill();
x.fillStyle='#0B1A12';x.font='700 24px "JetBrains Mono"';x.textAlign='center';x.textBaseline='middle';x.fillText('!',122,144);x.textAlign='left';
x.fillStyle='#F5F5F2';x.font='600 26px "Space Grotesk"';x.fillText('Zajtra 9:00',158,130);x.fillStyle='#9A9A92';x.font='500 20px "JetBrains Mono"';x.fillText('event · Bratislava',158,162);
// toggle
chip(80,740,120,62,'#1FAF6F');x.fillStyle='#fff';x.beginPath();x.arc(169,771,24,0,7);x.fill();
// check chip
chip(230,744,170,54,'#1C1F1D','rgba(255,255,255,.12)');x.strokeStyle='#5CF0A4';x.lineWidth=6;x.lineCap='round';x.beginPath();x.moveTo(252,771);x.lineTo(264,783);x.lineTo(286,757);x.stroke();
x.fillStyle='#E9E9E2';x.font='600 24px "Space Grotesk"';x.fillText('Hotovo',300,772);
// mini bar chart
chip(1330,90,190,120,'#1C1F1D','rgba(255,255,255,.12)');[40,70,52,92,64].forEach((v,i)=>{x.fillStyle=i===3?'#5CF0A4':'rgba(92,240,164,.45)';rr(1355+i*32,190-v,20,v,5);x.fill();});
vignette();
});
</script></body></html>
