<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../cv/f/f.css"><style>html,body{margin:0;background:#0B0C0B}canvas{display:block}</style></head><body>
<canvas id="c" width="1600" height="900"></canvas><script src="_base.js"></script><script>
// uses the real usage screenshots from img/; no glitch pass: reading pixels of local images is blocked
const srcs=['../../../img/usage-claude.webp','../../../img/usage-day1.webp'];
Promise.all([document.fonts.load('700 80px "Space Grotesk"'),document.fonts.load('500 26px "JetBrains Mono"'),...srcs.map(s=>new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.src=s;}))]).then(([, ,...imgs])=>{
// thumbnail style: big title + the two real screenshots, nothing else
bg('#2A0B10','#0C0506');
let g=x.createRadialGradient(1150,450,40,1150,450,820);g.addColorStop(0,'rgba(214,30,52,.55)');g.addColorStop(1,'rgba(214,30,52,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
g=x.createRadialGradient(260,450,20,260,450,620);g.addColorStop(0,'rgba(120,10,24,.35)');g.addColorStop(1,'rgba(120,10,24,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
function card(img,sx,sy,sw,sh,cx,cy,w,rot){const h=w*sh/sw;x.save();x.translate(cx,cy);x.rotate(rot);x.shadowColor='rgba(0,0,0,.7)';x.shadowBlur=70;x.shadowOffsetY=28;x.fillStyle='#0A0A0A';rr(-w/2-16,-h/2-16,w+32,h+32,38);x.fill();x.shadowColor='transparent';x.save();rr(-w/2,-h/2,w,h,24);x.clip();x.drawImage(img,sx,sy,sw,sh,-w/2,-h/2,w,h);x.restore();x.restore();}
// Claude usage screen (700x619), big
card(imgs[0],0,0,700,619,1150,410,700,.035);
// Grok weekly strip (700x163), overlapping bottom-left of it
card(imgs[1],0,0,700,163,980,760,600,-.045);
x.textBaseline='alphabetic';x.fillStyle='#FFFFFF';x.shadowColor='rgba(0,0,0,.55)';x.shadowBlur=30;
x.font='700 138px "Space Grotesk", sans-serif'; x.fillText('Zabi chaos,',70,300); x.fillText('zachrániš',70,440);
x.fillStyle='#FF3B4E'; x.fillText('usage.',70,580); x.shadowColor='transparent';
vignette();
});
</script></body></html>
