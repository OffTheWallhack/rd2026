<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>si/zaplatil</title>
<meta name="description" content="Nahraj účet. Znudený miliardár swipne doprava a zaplatí ho. Pre Slovensko aj Česko.">
<meta name="theme-color" content="#0b0614">
<link rel="canonical" href="https://durica.si/zaplatil/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="durica.si">
<meta property="og:title" content="si/zaplatil">
<meta property="og:description" content="Nahraj účet. Znudený miliardár swipne doprava a zaplatí ho.">
<meta property="og:url" content="https://durica.si/zaplatil/">
<meta property="og:image" content="https://durica.si/zaplatil/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="ikony/icon-192.png">
<link rel="apple-touch-icon" href="ikony/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="si/zaplatil">
<link rel="preconnect" href="https://znsrokpaoczljisaoulu.supabase.co">
<link rel="preload" href="pismo/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="pozadie" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i><span class="zrno"></span></div>

<div class="app">
  <header class="hlava">
    <a class="logo" href="./" aria-label="si/zaplatil">si/<em>zaplatil</em></a>
    <div class="hlava-vpravo">
      <div class="jazyk sklo" role="group" aria-label="Jazyk / Jazyk">
        <button type="button" id="jazyk-sk" aria-pressed="true">SK</button>
        <button type="button" id="jazyk-cz" aria-pressed="false">CZ</button>
      </div>
      <button type="button" class="ikona-btn sklo" id="btn-info" data-tal="ako"><span aria-hidden="true">?</span></button>
      <button type="button" class="profil-btn" id="btn-profil"></button>
    </div>
  </header>

  <main>
    <!-- PLATIŤ -->
    <section class="view view-platit" id="v-platit" role="tabpanel" aria-labelledby="tab-platit">
      <div class="nad-deckom">
        <p class="slogan" data-t="slogan"></p>
        <p class="stat" id="stat" aria-live="polite"></p>
      </div>
      <div class="deck" id="deck" aria-live="polite"></div>
      <div class="akcie">
        <button type="button" class="okruhle nie sklo" id="btn-nie" data-tal="nuda"><span aria-hidden="true">✕</span></button>
        <button type="button" class="nahlas" id="btn-nahlas" data-t="nahlasit"></button>
        <button type="button" class="okruhle ano" id="btn-ano" data-tal="zaplatim"><span aria-hidden="true">€</span></button>
      </div>
    </section>

    <!-- NAHRAŤ -->
    <section class="view view-scroll" id="v-nahrat" role="tabpanel" aria-labelledby="tab-nahrat" hidden>
      <div id="nahrat-brana" hidden></div>
      <form class="formular" id="form" novalidate hidden>
        <h1 data-t="nahraj"></h1>
        <p class="uvod" data-t="nahraj_uvod"></p>
        <p class="upozornenie info" id="novacik" data-t="novacik" hidden></p>

        <div class="karta-form sklo">
          <span class="menovka" data-t="priloha"></span>
          <div class="subor-zona">
            <input type="file" id="f-priloha" accept="image/*,application/pdf" class="skryty-input">
            <label class="subor-vyber velky" for="f-priloha" id="priloha-vyber">
              <span class="subor-ikona" aria-hidden="true">＋</span>
              <b data-t="priloha_vyber"></b>
              <span data-t="priloha_sub"></span>
            </label>
            <div id="priloha-nahlad" hidden>
              <div class="editor" id="priloha-editor" hidden>
                <canvas id="priloha-canvas" class="editor-canvas" data-tal="zakry"></canvas>
                <p class="drobne" data-t="zakry"></p>
                <div class="tl-rad maly">
                  <button type="button" class="tl-maly" id="priloha-spat" data-t="vratit_zakrytie"></button>
                  <button type="button" class="tl-maly" id="priloha-prec" data-t="odstranit"></button>
                </div>
              </div>
              <div class="pdf-nahlad" id="priloha-pdf" hidden>
                <canvas id="priloha-pdf-canvas" width="1" height="1"></canvas>
                <div>
                  <b id="priloha-pdf-meno"></b>
                  <p class="drobne" data-t="pdf_info"></p>
                  <button type="button" class="tl-maly" id="priloha-pdf-prec" data-t="odstranit"></button>
                </div>
              </div>
            </div>
          </div>
          <p class="qr-stav" id="qr-stav" role="status" hidden></p>
        </div>

        <div class="karta-form sklo">
          <div class="pole">
            <label class="menovka" for="f-nazov" data-t="co_je"></label>
            <input type="text" id="f-nazov" maxlength="60" data-tph="co_je_ph" autocomplete="off" required>
          </div>
          <div class="pole-rad">
            <div class="pole rast">
              <label class="menovka" for="f-suma" data-t="suma"></label>
              <input type="text" id="f-suma" inputmode="decimal" autocomplete="off" required>
            </div>
            <div class="pole">
              <span class="menovka" data-t="mena"></span>
              <div class="segment" id="mena" role="group">
                <button type="button" data-mena="EUR" aria-pressed="true">€</button>
                <button type="button" data-mena="CZK" aria-pressed="false">Kč</button>
              </div>
            </div>
          </div>
          <div class="pole">
            <span class="menovka" data-t="kategoria"></span>
            <div class="cipy" id="kat" role="radiogroup"></div>
          </div>
          <div class="pole">
            <label class="menovka" for="f-pribeh"><span data-t="preco"></span> <i data-t="nepovinne"></i></label>
            <textarea id="f-pribeh" maxlength="280" rows="3" data-tph="preco_ph"></textarea>
          </div>
        </div>

        <fieldset class="karta-form sklo">
          <legend data-t="kam"></legend>
          <p class="rada" data-t="kam_rada"></p>
          <div class="pole">
            <label class="menovka" for="f-prijemca" data-t="prijemca_lbl"></label>
            <input type="text" id="f-prijemca" maxlength="70" data-tph="prijemca_ph" autocomplete="off" required>
          </div>
          <div class="pole">
            <label class="menovka" for="f-iban" data-t="iban"></label>
            <input type="text" id="f-iban" maxlength="42" autocomplete="off" autocapitalize="characters" spellcheck="false" required>
          </div>
          <div class="pole">
            <label class="menovka" for="f-vs"><span data-t="vs"></span> <i data-t="nepovinne"></i></label>
            <input type="text" id="f-vs" inputmode="numeric" maxlength="10" placeholder="1234567890" autocomplete="off">
          </div>
        </fieldset>

        <label class="suhlas" for="f-suhlas">
          <input type="checkbox" id="f-suhlas" required>
          <span data-t="suhlas"></span>
        </label>

        <p class="chyba" id="form-chyba" role="alert" hidden></p>
        <button type="submit" class="tl tl-hlavne" id="btn-odoslat" data-t="nahrat_btn"></button>
      </form>

      <div class="hotovo" id="hotovo" hidden>
        <div class="hotovo-peciatka" data-t="hotovo"></div>
        <h1 data-t="hotovo_h"></h1>
        <p data-t="hotovo_p"></p>
        <button type="button" class="tl tl-hlavne" id="btn-zdielat" data-t="zdielat"></button>
        <button type="button" class="tl tl-druhe" id="btn-dalsi" data-t="dalsi"></button>
      </div>
    </section>

    <!-- ZHODY -->
    <section class="view view-scroll" id="v-zhody" role="tabpanel" aria-labelledby="tab-zhody" hidden>
      <div class="obsah">
        <h1 data-t="zhody_h"></h1>
        <div id="zhody-obsah"></div>
      </div>
    </section>
  </main>

  <nav class="lista sklo" role="tablist">
    <button type="button" role="tab" id="tab-platit" data-view="platit" aria-selected="true" aria-controls="v-platit">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="3.5"/><path d="M9 9h6M9 13h4"/></svg>
      <span data-t="tab_platit"></span>
    </button>
    <button type="button" role="tab" id="tab-nahrat" data-view="nahrat" aria-selected="false" aria-controls="v-nahrat">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v8M8 12h8"/></svg>
      <span data-t="tab_nahrat"></span>
    </button>
    <button type="button" role="tab" id="tab-zhody" data-view="zhody" aria-selected="false" aria-controls="v-zhody">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 6.5a3 3 0 0 1 3-3h9a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H11l-4.5 4v-4h0a2 2 0 0 1-2-2z"/></svg>
      <span data-t="tab_zhody"></span>
      <span class="bodka" id="zhody-bodka" hidden></span>
    </button>
  </nav>
</div>

<!-- ZHODA -->
<div class="zhoda" id="zhoda" role="dialog" aria-modal="true" hidden></div>

<!-- CHAT -->
<div class="chat" id="chat" role="dialog" aria-modal="true" hidden>
  <div class="chat-vrch sklo">
    <div class="chat-hlava" id="chat-hlava"></div>
    <div class="chat-ucet" id="chat-ucet"></div>
  </div>
  <div class="chat-spravy" id="chat-spravy" aria-live="polite"></div>
  <div class="chat-spodok sklo">
    <div class="chat-akcie" id="chat-akcie"></div>
    <form class="chat-pisanie" id="chat-pisanie">
      <input type="text" id="chat-vstup" maxlength="500" data-tph="spr_ph" autocomplete="off">
      <button type="submit" class="poslat-btn" data-tal="poslat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
    </form>
  </div>
</div>

<div class="zaves" id="zaves" hidden>
  <div class="harok sklo" id="harok" role="dialog" aria-modal="true" aria-labelledby="harok-nadpis" tabindex="-1"></div>
</div>

<div class="lupa" id="lupa" hidden>
  <img id="lupa-img" alt="">
  <button type="button" class="lupa-zavri" id="lupa-zavri">✕</button>
</div>

<div class="toast sklo" id="toast" role="status" aria-live="polite" hidden></div>
<div class="oslava" id="oslava" aria-hidden="true"></div>

<script src="preklady.js"></script>
<script src="qrcode.js"></script>
<script src="citac.js"></script>
<script src="app.js"></script>
<script src="/stats.js" defer></script>
</body>
</html>
